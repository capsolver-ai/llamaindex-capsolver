name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  repository-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required community files
        run: test -f README.md && test -f LICENSE && test -f SECURITY.md && test -f CONTRIBUTING.md
      - name: Reject accidentally committed environment files
        run: test -z "$(find . -name .env -not -path './.git/*' -print -quit)"
